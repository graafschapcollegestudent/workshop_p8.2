name: Docker Build en Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login naar DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Versie bepalen
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build en push image
        uses: docker/build-push-action@v6
        with:
          context: ./tasktracker-api
          push: true
          tags: |
            hadi12345678910/tasktracker-api:${{ steps.version.outputs.VERSION }}
            hadi12345678910/tasktracker-api:latest